CONFIG_ZMK_KEYBOARD_NAME="AdeptBLE"
 
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_GPIO=y
 
# CONFIG_ZMK_EXT_POWER=y
 
# PMW3610 Driver
CONFIG_PINCTRL=y
CONFIG_PMW3610_ALT=y
# CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000
# ^ uncomment if the log shows "Incorrect product id 0xFF (expecting 0x3E)!"
 
# CONFIG_PMW3610_ALT_REST1_SAMPLE_TIME_MS=20
# CONFIG_PMW3610_ALT_REST2_SAMPLE_TIME_MS=200
CONFIG_PMW3610_ALT_REST3_SAMPLE_TIME_MS=100
# CONFIG_PMW3610_ALT_RUN_DOWNSHIFT_TIME_MS=500
# CONFIG_PMW3610_ALT_REST1_DOWNSHIFT_TIME_MS=3000
# CONFIG_PMW3610_ALT_REST2_DOWNSHIFT_TIME_MS=30000
 
# CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12
# CONFIG_PMW3610_ALT_SMART_ALGORITHM=y  # defaults to y already, no need to set
 
CONFIG_BT_CTLR_TX_PWR_PLUS_8=n
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# (re-enabled - testing showed this wasn't the cause of the reconnect loop)

# --- Temporary: debug logging for the BLE pairing/reconnect investigation ---
CONFIG_ZMK_USB_LOGGING=y
CONFIG_BT_CONN_LOG_LEVEL_DBG=y
CONFIG_BT_SMP_LOG_LEVEL_DBG=y
CONFIG_BT_GATT_LOG_LEVEL_DBG=y
CONFIG_BT_KEYS_LOG_LEVEL_DBG=y
CONFIG_BT_SHELL=y
CONFIG_SENSOR_SHELL=n
# ^ BT_SHELL pulls in SHELL, which combined with the existing battery ADC's
#   CONFIG_SENSOR=y auto-enables SENSOR_SHELL - which needs floating-point
#   printf support this image doesn't have. We don't need sensor shell
#   commands, just 'bt bonds', so turn it back off explicitly.
# ^ gives an interactive 'bt bonds' command over the USB serial console.
# Remove these lines once we're done debugging.
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=y
 
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# ZMK defaults BT_DEVICE_APPEARANCE to 961 (Keyboard) project-wide, since ZMK
# is primarily a keyboard firmware. This is a trackball, not a keyboard -
# override to the correct GAP appearance (962 = Mouse). Possible this
# mismatch triggers stricter host-side security policy for devices
# self-identifying as keyboards.
CONFIG_BT_DEVICE_APPEARANCE=962
